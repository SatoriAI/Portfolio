# The frontend half of the gate. One job, steps ordered cheapest first.
#
# It was three jobs in a `needs:` chain — lint, then test, then build — on the
# reasoning that linting should gate the build. That reasoning was wrong about
# the mechanism: a failed *step* already stops the job, so the chain bought the
# same fail-fast and charged two extra checkouts and `npm ci` for it. Measured
# here at roughly 15s of setup per job against 9s, 2s and 5s of actual work, so
# the chain spent longer provisioning than checking.
#
# The backend's split is different and stays: failing before its test job avoids
# provisioning Postgres, which is real work rather than step ordering.
name: Frontend Quality

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
      - '.github/actions/setup-node/**'
  # Deliberately unfiltered by branch. `branches:` here matches the *base* of the
  # pull request, so restricting it to main silently skipped this entire workflow
  # for stacked pull requests: they reported a single green check and looked
  # verified while nothing had actually run.
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
      - '.github/actions/setup-node/**'
  # With path filters there is otherwise no way to ask for a run on a ref whose
  # last push touched the other half — after a runner-image change, an action
  # bump worth a second look, or simply "is main green today".
  workflow_dispatch:

# The token reads the repository and nothing else; no job here writes anywhere.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Nobody needs the
  # verdict on a commit that has already been replaced.
  group: frontend-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    # The default is six hours, long enough for one wedged run to hold a branch
    # hostage while reporting nothing.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and left on disk the token is readable by every
          # step that follows — including a dependency's install script.
          persist-credentials: false

      - name: Set Up Node Environment
        uses: ./.github/actions/setup-node

      # Cheapest first: a failed step stops the job exactly as a failed job
      # stopped the chain this replaced.
      - name: Check Formatting
        run: make format-frontend

      - name: Run Vitest
        run: make test-frontend

      - name: Run ESLint
        run: make lint-frontend

      # Last because it is the slowest, and because it is the only step that
      # typechecks the project — `npm run lint` is ESLint, which does not.
      - name: Build
        run: make build
