name: Hygiene

# Deliberately unfiltered: the lefthook suite runs over the whole repository on
# every change, so a frontend-only pull request still gets the repo-wide checks
# and vice versa. The jobs inside lefthook.yml are themselves path-scoped, so
# the half that did not change simply matches no files and is skipped.
on:
  push:
    branches:
      - main
  pull_request:
  # With path filters there is otherwise no way to ask for a run on a ref whose
  # last push touched the other half — after a runner-image change, an action
  # bump worth a second look, or simply "is main green today".
  workflow_dispatch:

# The token reads the repository and nothing else; no job here writes anywhere.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Nobody needs the
  # verdict on a commit that has already been replaced.
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook:
    name: Lefthook Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and left on disk the token is readable by every
          # step that follows — including a dependency's install script.
          persist-credentials: false

      # Python only. This job used to install the frontend toolchain as well,
      # to run eslint and prettier that frontend-quality had already run on the
      # same files. Dropping it removes an `npm ci` from the highest-frequency
      # job in the repository.
      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      # setup-node directly rather than the composite action, which also runs
      # `npm ci` in frontend/ — needed for the frontend hooks, and this job no
      # longer runs them. Node is here only to install lefthook itself.
      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Pinned so CI and a Homebrew install locally cannot drift apart in a way
      # that changes how lefthook.yml is interpreted.
      - name: Install Lefthook
        run: npm install -g lefthook@2.1.12

      # fail_on_changes: "ci" in lefthook.yml makes this an assertion rather
      # than a fixer: locally ruff and prettier rewrite files and stage them,
      # but here any rewrite fails the job. Without it a badly formatted commit
      # would go green, because the formatter fixes the file and exits zero.
      # --tag backend --tag repo: the frontend jobs are deliberately excluded,
      # because frontend-quality owns that verdict. Everything ruff, bandit and
      # codespell judge runs nowhere else, which is why this job still exists.
      - name: Run Lefthook
        run: lefthook run pre-commit --all-files --tag backend --tag repo
