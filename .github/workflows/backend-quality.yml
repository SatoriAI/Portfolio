name: Backend Quality

# Path-filtered so a frontend-only change does not spin up Postgres to run the
# Django suite. The workflow and its composite action are listed alongside
# backend/** so that changes to CI itself still trigger it.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
      - '.github/actions/setup-python/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
      - '.github/actions/setup-python/**'

defaults:
  run:
    working-directory: backend

jobs:
  pylint:
    name: Pylint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Run Pylint
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: ""
          CORS_ALLOWED_ORIGINS: ""
          CSRF_TRUSTED_ORIGINS: ""
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: uv run pylint portfolio/portfolio portfolio/university portfolio/utils portfolio/work

  mypy:
    name: MyPy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Run MyPy
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: ""
          CORS_ALLOWED_ORIGINS: ""
          CSRF_TRUSTED_ORIGINS: ""
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: uv run mypy .

  pytest:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [ pylint, mypy ]

    services:
      postgres:
        # pgvector's image, not stock postgres, and matched to docker-compose.
        # Vex keeps its embeddings in a vector column, so CI on plain postgres
        # could never run a test that touches the vector store — the capability
        # was untestable rather than untested.
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Install gettext for Django compilemessages
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile Translations (.po -> .mo)
        run: |
          cd portfolio
          uv run django-admin compilemessages -l pl

      - name: Run Pytest
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: uv run pytest --cov-report xml  --junitxml=report.xml

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # 'uses:' steps ignore defaults.run.working-directory, so this path is
          # relative to the repository root. codecov.yml prefixes the paths
          # inside the report to match.
          files: backend/coverage.xml
