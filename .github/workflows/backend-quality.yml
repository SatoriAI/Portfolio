# The backend half of the gate, split on one axis: whether a step needs the
# database. Pylint and MyPy answer in parallel; Postgres and the suite are paid
# for only on a branch where both cheap answers were already yes.
#
# They stay two jobs rather than one. Merging them would save billed minutes,
# which is the right trade in a private repository — but this one is public, so
# Actions minutes are free and the only currency is how fast the answer arrives.
# In parallel that is 82s; merged it would be 97s.
name: Backend Quality

# Path-filtered so a frontend-only change does not spin up Postgres to run the
# Django suite. The workflow and its composite action are listed alongside
# backend/** so that changes to CI itself still trigger it.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
      - '.github/actions/setup-python/**'
  # Deliberately unfiltered by branch: `branches:` here matches the *base* of
  # the pull request, so restricting it to main silently skipped this workflow
  # for stacked pull requests, which then looked verified having run nothing.
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
      - '.github/actions/setup-python/**'
  # With path filters there is otherwise no way to ask for a run on a ref whose
  # last push touched the other half — after a runner-image change, an action
  # bump worth a second look, or simply "is main green today".
  workflow_dispatch:

# The token reads the repository and nothing else; no job here writes anywhere.
permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same ref. Nobody needs the
  # verdict on a commit that has already been replaced.
  group: backend-${{ github.ref }}
  cancel-in-progress: true


jobs:
  pylint:
    name: Pylint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and left on disk the token is readable by every
          # step that follows — including a dependency's install script.
          persist-credentials: false

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Run Pylint
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: ""
          CORS_ALLOWED_ORIGINS: ""
          CSRF_TRUSTED_ORIGINS: ""
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: make lint-backend

  mypy:
    name: MyPy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and left on disk the token is readable by every
          # step that follows — including a dependency's install script.
          persist-credentials: false

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Run MyPy
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: ""
          CORS_ALLOWED_ORIGINS: ""
          CSRF_TRUSTED_ORIGINS: ""
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: make typecheck

  pytest:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ pylint, mypy ]

    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and left on disk the token is readable by every
          # step that follows — including a dependency's install script.
          persist-credentials: false

      - name: Set Up Python Environment
        uses: ./.github/actions/setup-python

      - name: Install gettext for Django compilemessages
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile Translations (.po -> .mo)
        run: make translations

      - name: Run Pytest
        env:
          SECRET_KEY: "0m(b5ytsmyyq9al$uulhdvb(hw^jge298(11pm49c!^6se&)ht"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          VECTOR_DB_COLLECTION: ""
          OPENAI_API_KEY: ""
          USE_S3: "False"
        run: make test-backend

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # 'uses:' steps ignore defaults.run.working-directory, so this path is
          # relative to the repository root. codecov.yml prefixes the paths
          # inside the report to match.
          files: backend/coverage.xml
