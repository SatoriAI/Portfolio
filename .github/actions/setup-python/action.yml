name: "Set Up Python Environment"
description: "Checks out code, sets up Python and UV, and installs dependencies with caching."

inputs:
  python-version:
    description: "The Python version to set up."
    required: true
    default: "3.13"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up UV
      uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
      with:
        version: "latest"

    - name: Cache UV Dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        # Hashes the real lockfile. This read '**/pyproject.lock' until the
        # monorepo move, a filename that has never existed here, so the key was
        # constant and the cache never once hit.
        key: ${{ runner.os }}-python-${{ inputs.python-version }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-uv-

    - name: Install Dependencies
      # `--locked`: a lockfile that no longer matches pyproject.toml fails here,
      # instead of CI quietly re-resolving and testing an environment that
      # matches no lockfile.
      run: uv sync --locked --group dev
      shell: bash
      # Composite actions do not inherit the calling job's
      # defaults.run.working-directory, so it has to be stated here.
      working-directory: backend
