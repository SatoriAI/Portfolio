name: "Set Up Python Environment"
description: "Checks out code, sets up Python and UV, and installs dependencies with caching."

inputs:
  python-version:
    description: "The Python version to set up."
    required: true
    default: "3.13"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up UV
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Cache UV Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        # Hashes the real lockfile. This read '**/pyproject.lock' until the
        # monorepo move, a filename that has never existed here, so the key was
        # constant and the cache never once hit.
        key: ${{ runner.os }}-python-${{ inputs.python-version }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-uv-

    - name: Install Dependencies
      run: uv sync --group dev
      shell: bash
      # Composite actions do not inherit the calling job's
      # defaults.run.working-directory, so it has to be stated here.
      working-directory: backend
