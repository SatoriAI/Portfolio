<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The social preview, 1200 x 630. og/render.sh draws it to public/og.png.
       Kit tokens only (visual-kit/README.md): background, ink, text-secondary,
       iris; the diffusion fields in two corners, the text on the calm centre.
       Set on the centre line, so the mark, the name, the rhythm and the
       address survive a square crop (x 285 to 915). -->
  <defs>
    <style>
      @font-face { font-family: "Manrope"; src: url("../public/fonts/Manrope.woff2"); font-weight: 200 800; }
      @font-face { font-family: "IBM Plex Mono"; src: url("../public/fonts/IBMPlexMono-Medium.woff2"); font-weight: 500; }
      text { text-anchor: middle; }
      .name { font: 600 84px "Manrope"; letter-spacing: -0.035em; fill: #17233D; }
      .line { font: 400 40px "Manrope"; fill: #566078; }
      .and { fill: #65509A; font-weight: 600; font-size: 48px; }
      .site { font: 500 26px "IBM Plex Mono"; letter-spacing: 0.02em; fill: #566078; }
    </style>
    <radialGradient id="lavender">
      <stop stop-color="#C6B4E7" />
      <stop offset="1" stop-color="#E8E1FA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blush">
      <stop stop-color="#EDC2D7" />
      <stop offset="1" stop-color="#F6E2EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#F8F9FC" />
  <ellipse cx="-60" cy="720" rx="440" ry="260" fill="url(#lavender)" />
  <ellipse cx="1180" cy="-20" rx="560" ry="320" fill="url(#blush)" />

  <!-- The Binary Axis symbol, navy, from visual-kit/symbol/dh-navy.svg,
       its artwork (x 13.5 to 86.5) centred on x 600. -->
  <g transform="translate(545 92) scale(1.1)" fill="none" stroke="#17233D" stroke-width="8.5"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 18V77H31A17.5 17.5 0 0 1 31 42H49" />
    <path d="M49 57C55 43 75 42 82 55V77" />
  </g>

  <text class="name" x="600" y="326">Dawid Hanrahan</text>
  <text class="line" x="600" y="396">Mathematician by training <tspan class="and">∧</tspan> engineer by trade.</text>

  <!-- The rhythm motif: a run of lines, one module a dot that breaks it. -->
  <g stroke="#65509A" stroke-width="3" stroke-linecap="butt">
    <path d="M564 446V486M576 446V486M588 446V486M600 446V486M624 446V486M636 446V486" />
  </g>
  <circle cx="612" cy="481" r="5" fill="#17233D" />

  <text class="site" x="600" y="560">www.dawidhanrahan.com</text>
</svg>
